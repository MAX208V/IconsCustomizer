name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK (ignore failure)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Show build errors in summary
        if: always()
        run: |
          {
            echo "# Build Result"
            echo ""
            echo '```'
            grep -E "(ERROR|error:|FAILURE|BUILD FAILED|Could not find|Unresolved|Cannot resolve|not found)" build.log 2>/dev/null | head -30
            echo ""
            echo "--- LAST 20 LINES ---"
            tail -20 build.log 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: IconsCustomizer-debug
          path: app/build/outputs/apk/debug/*.apk

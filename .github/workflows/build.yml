name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Upload APK
        if: success()
        run: |
          echo "Looking for APK files..."
          find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          mkdir -p /tmp/apk-output
          find app/build -name "*.apk" -type f -exec cp {} /tmp/apk-output/ \; 2>/dev/null || true
          ls -la /tmp/apk-output/
        shell: bash

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IconsCustomizer-debug
          path: /tmp/apk-output/
          if-no-files-found: warn

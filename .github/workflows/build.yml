name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Check Gradle configuration
        continue-on-error: true
        run: |
          ./gradlew tasks --no-daemon --info 2>&1 | tee gradle_config.log
          grep -i "error\|failure\|not found\|could not" gradle_config.log | head -20 || echo "No obvious errors found"

      - name: Check dependencies
        continue-on-error: true
        run: |
          echo "=== compileOnly deps ==="
          ./gradlew dependencies --no-daemon --configuration compileOnly 2>&1 | tail -30
          echo "=== implementation deps ==="
          ./gradlew dependencies --no-daemon --configuration implementation 2>&1 | tail -30

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IconsCustomizer-debug
          path: app/build/outputs/apk/debug/*.apk
